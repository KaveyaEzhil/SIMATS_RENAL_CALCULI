name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Display Xcode version
        run: |
          xcodebuild -version

      - name: Run Unit Tests
        run: |
          swiftc -sdk $(xcrun --show-sdk-path) \
                 RenalCalculi/ServiceAPI.swift \
                 RenalCalculi/SharedModels.swift \
                 Tests/RenalCalculiTests.swift \
                 -o Tests/test_runner
          Tests/test_runner
          rm -f Tests/test_runner

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          pod install

      - name: Build iOS Application
        run: |
          xcodebuild -workspace RenalCalculi.xcworkspace \
                     -scheme RenalCalculi \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build
